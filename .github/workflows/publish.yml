name: Release (Publish to npm & Deploy Docs)

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Publish & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - name: Build all packages
        run: npm run build:all

      - name: Run tests
        run: npm run test:all

      - name: Verify package contents
        run: |
          echo "=== @syncraft-labs/core ==="
          cd packages/core && npm pack --dry-run
          echo ""
          echo "=== @syncraft-labs/react ==="
          cd ../react && npm pack --dry-run
          echo ""
          echo "=== @syncraft-labs/vue ==="
          cd ../vue && npm pack --dry-run

      - name: Publish @syncraft-labs/core
        run: |
          if npm view @syncraft-labs/core@0.5.0 version 2>/dev/null; then
            echo "@syncraft-labs/core@0.5.0 already published, skipping"
          else
            cd packages/core && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @syncraft-labs/react
        run: |
          if npm view @syncraft-labs/react@0.5.0 version 2>/dev/null; then
            echo "@syncraft-labs/react@0.5.0 already published, skipping"
          else
            cd packages/react && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @syncraft-labs/vue
        run: |
          if npm view @syncraft-labs/vue@0.5.0 version 2>/dev/null; then
            echo "@syncraft-labs/vue@0.5.0 already published, skipping"
          else
            cd packages/vue && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deploy Docs to Netlify
        run: npx netlify-cli deploy --prod --dir=apps/docs/dist --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

