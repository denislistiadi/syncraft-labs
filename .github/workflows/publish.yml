name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: |
          echo "=== @syncraft-labs/core ==="
          (cd packages/core && npm pack --dry-run)
          echo ""
          echo "=== @syncraft-labs/react ==="
          (cd packages/react && npm pack --dry-run)
          echo ""
          echo "=== @syncraft-labs/vue ==="
          (cd packages/vue && npm pack --dry-run)

      - name: Publish @syncraft-labs/core
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if npm view @syncraft-labs/core@$VERSION version >/dev/null 2>&1; then
            echo "@syncraft-labs/core@$VERSION already published, skipping"
          else
            cd packages/core && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @syncraft-labs/react
        run: |
          VERSION=$(node -p "require('./packages/react/package.json').version")
          if npm view @syncraft-labs/react@$VERSION version >/dev/null 2>&1; then
            echo "@syncraft-labs/react@$VERSION already published, skipping"
          else
            cd packages/react && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @syncraft-labs/vue
        run: |
          VERSION=$(node -p "require('./packages/vue/package.json').version")
          if npm view @syncraft-labs/vue@$VERSION version >/dev/null 2>&1; then
            echo "@syncraft-labs/vue@$VERSION already published, skipping"
          else
            cd packages/vue && npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


