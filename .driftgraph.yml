- name: "Core Isolation (Framework Agnostic)"
  source: "packages/core/src/**/*"
  forbiddenImports:
    - "packages/react/src/**/*"
    - "packages/vue/src/**/*"
    - "apps/**/*"

- name: "Cross-Framework Isolation (React to Vue)"
  source: "packages/react/src/**/*"
  forbiddenImports:
    - "packages/vue/src/**/*"
    - "apps/**/*"

- name: "Cross-Framework Isolation (Vue to React)"
  source: "packages/vue/src/**/*"
  forbiddenImports:
    - "packages/react/src/**/*"
    - "apps/**/*"
