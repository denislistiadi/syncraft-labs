services:
  - type: web
    name: syncraft-demo-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci && npm run build -- --filter=@syncraft-labs/demo-api
    startCommand: node apps/demo-api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_MAX
        value: "120"
    buildFilter:
      paths:
        - apps/demo-api/**
        - packages/core/**
        - package.json
        - package-lock.json
        - turbo.json

  - type: web
    name: syncraft-demo-web
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -- --filter=@syncraft-labs/demo-web
    staticPublishPath: apps/demo-web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Public origin of the API service, without a trailing slash.
      - key: VITE_API_URL
        sync: false
    buildFilter:
      paths:
        - apps/demo-web/**
        - packages/core/**
        - packages/react/**
        - packages/vue/**
        - package.json
        - package-lock.json
        - turbo.json
